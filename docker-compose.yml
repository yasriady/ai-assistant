services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiap_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ai_assessment
      DB_USERNAME: ai_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aiap

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiap_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ai_assessment
      DB_USERNAME: ai_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - aiap

  nginx:
    image: nginx:1.27-alpine
    container_name: aiap_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - aiap

  mysql:
    image: mysql:8.0
    container_name: aiap_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_assessment
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - aiap_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - aiap

  redis:
    image: redis:7-alpine
    container_name: aiap_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - aiap_redis:/data
    networks:
      - aiap

networks:
  aiap:
    driver: bridge

volumes:
  aiap_mysql:
  aiap_redis:
